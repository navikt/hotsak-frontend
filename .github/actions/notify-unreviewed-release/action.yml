name: Varsle om release uten uavhengig godkjenning
description: Send Slack-varsel når en publisert release ikke har en uavhengig menneskelig PR-godkjenning

inputs:
  github-token:
    description: GitHub-token med tilgang til repository-data
    required: true
  slack-webhook-url:
    description: Slack incoming webhook URL
    required: true
  repository:
    description: Repository i owner/name-format
    required: true
  release-tag:
    description: Taggen til den publiserte releasen
    required: true
  release-name:
    description: Navnet på releasen
    required: true
  release-url:
    description: URL til releasen
    required: true

runs:
  using: composite
  steps:
    - name: Finn behov for Slack-varsel
      id: evaluate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_NAME: ${{ inputs.release-name }}
        RELEASE_URL: ${{ inputs.release-url }}
      run: |
        set -euo pipefail

        commit_sha="$(gh api "repos/${REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
        commit_url="https://github.com/${REPOSITORY}/commit/${commit_sha}"

        pull_request="$(gh api --paginate --slurp "repos/${REPOSITORY}/commits/${commit_sha}/pulls" |
          jq -r 'add | [.[] | select(.merged_at != null)] | sort_by(.merged_at) | reverse | .[0]')"

        notify="false"
        reason=""
        pull_request_url=""

        if [[ -z "${pull_request}" || "${pull_request}" == "null" ]]; then
          notify="true"
          reason="release-committen kunne ikke kobles til en merget pull request"
        else
          pull_request_number="$(jq -r '.number' <<<"${pull_request}")"
          pull_request_author="$(jq -r '.user.login' <<<"${pull_request}")"
          pull_request_url="$(jq -r '.html_url' <<<"${pull_request}")"

          reviews="$(gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${pull_request_number}/reviews" | jq 'add')"
          has_independent_approval="$(
            jq -r --arg pull_request_author "${pull_request_author}" '
              [
                .[]
                | select(.user.login != null)
                | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                | {login: .user.login, type: (.user.type // ""), state: .state}
              ]
              | group_by(.login)
              | map(.[-1])
              | any(
                  .[];
                  .state == "APPROVED"
                  and .type != "Bot"
                  and (.login | endswith("[bot]") | not)
                  and .login != $pull_request_author
                )
            ' <<<"${reviews}"
          )"

          if [[ "${has_independent_approval}" != "true" ]]; then
            notify="true"
            reason="pull requesten mangler en gjeldende menneskelig godkjenning fra en annen enn forfatteren"
          fi
        fi

        if [[ "${notify}" == "true" ]]; then
          message="Release ${RELEASE_NAME} (${RELEASE_TAG}) mangler uavhengig PR-godkjenning: ${reason}. ${RELEASE_URL}"
          if [[ -n "${pull_request_url}" ]]; then
            message+=" PR: ${pull_request_url}."
          fi
          message+=" Commit: ${commit_url}."
          payload="$(jq -cn --arg text "${message}" '{text: $text}')"

          {
            echo "notify=true"
            echo "payload<<EOF"
            echo "${payload}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
        else
          echo "notify=false" >> "${GITHUB_OUTPUT}"
          echo "Ingen Slack-varsling: releasen har en uavhengig menneskelig PR-godkjenning."
        fi

    - name: Send Slack-varsel
      if: steps.evaluate.outputs.notify == 'true'
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload: ${{ steps.evaluate.outputs.payload }}
