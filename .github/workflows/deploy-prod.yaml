name: Deploy til prod-gcp

on:
  release:
    types:
      - published

jobs:
  notify-unreviewed-release:
    name: Varsle om manglende release-godkjenning
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Krever repository- eller environment-secret: SLACK_WEBHOOK_URL.
      - name: Kontroller release-godkjenning og varsle Slack
        uses: navikt/digihot-deploy/actions/post-deploy@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          repository: ${{ github.repository }}
          release-tag: ${{ github.event.release.tag_name }}
          release-name: ${{ github.event.release.name }}
          release-url: ${{ github.event.release.html_url }}

  deploy-prod:
    name: Deploy til prod-gcp
    environment: 'prod-gcp:teamdigihot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v7

      - name: NAIS-login
        uses: nais/login@v0
        id: nais-login
        with:
          team: teamdigihot
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

      - name: Definer release tag
        env:
          VERSION_TAG: ${{ github.event.release.tag_name }}
          REGISTRY: ${{ steps.nais-login.outputs.registry }}
          APP: ${{ github.event.repository.name }}
        run: |
          IMAGE=$REGISTRY/$APP:$VERSION_TAG
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo $IMAGE

      - name: Deploy til prod-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/prod.yaml
          VAR: commit=${{ github.sha }}

      - name: Etter deploy
        uses: navikt/digihot-deploy/actions/post-production@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
